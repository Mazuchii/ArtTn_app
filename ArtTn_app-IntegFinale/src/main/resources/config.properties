# ------------------------------------------------------------
# Symfony uploads base path
#
# Set this to the absolute path of your Symfony project's
# public/uploads directory on your local machine.
#
# Examples:
#   Windows : C:/xampp/htdocs/museum-symfony/public/uploads
#   Linux   : /var/www/museum-symfony/public/uploads
#   macOS   : /Users/yourname/Sites/museum-symfony/public/uploads
#
# The image_url stored in the DB is appended to this path.
# e.g.  symfony.uploads.path + "/" + "events/myimage.jpg"
# ------------------------------------------------------------
symfony.uploads.path=C:/Users/user/Desktop/Esprit-PIDEV-3A37-2026-ArtTN-verification/public/uploads/evenements

# ------------------------------------------------------------
# Fallback: JavaFX classpath images folder
# (used when the Symfony path is unavailable)
# ------------------------------------------------------------
javafx.images.classpath=/images
